name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.10" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: macos-15, python: "3.13" }
          - { os: windows-2025, python: "3.13" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: poppler
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q poppler-utils xvfb; else brew install poppler; fi
      - id: poppler
        if: runner.os == 'Windows'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: poppler
          create-args: poppler
          init-shell: none
          post-cleanup: none
      - name: poppler on the PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "${{ steps.poppler.outputs.environment-path }}/Library/bin" >> "$GITHUB_PATH"
      - run: pip install '.[test]'
      - name: pytest
        shell: bash
        # a display for the Tk window's tests on Linux
        run: if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a pytest -q; else pytest -q; fi
