name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.10" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: macos-15, python: "3.13" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: poppler
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q poppler-utils; else brew install poppler; fi
      - run: pip install '.[test]'
      - run: pytest -q
